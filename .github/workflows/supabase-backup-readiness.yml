name: Supabase Backup Readiness

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  backup-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    env:
      SUPABASE_PROJECT_REF: qfnqhpdvhbhpdgrxdnlu
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure Supabase access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is missing."
            exit 1
          fi

      - name: Login to Supabase CLI
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Run backup readiness check
        id: backups
        run: |
          set +e
          npm run check:backup-readiness > backup-readiness-report.txt 2>&1
          ec=$?
          cat backup-readiness-report.txt
          echo "exit_code=$ec" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload backup readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-readiness-report
          path: backup-readiness-report.txt
          if-no-files-found: ignore

      - name: Open or update issue on readiness failure
        if: steps.backups.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.existsSync("backup-readiness-report.txt")
              ? fs.readFileSync("backup-readiness-report.txt", "utf8")
              : "backup-readiness-report.txt not found";
            const marker = "[backup-readiness]";
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            const existing = issues.find((i) => i.title.startsWith(`${marker} incident`));
            const now = new Date().toISOString();
            const body = `Automatic backup readiness check failed at ${now}.

\`\`\`
${report}
\`\`\`

Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}
`;

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: `${marker} incident ${now}`,
                body
              });
            }

      - name: Mark workflow as failed when readiness fails
        if: steps.backups.outputs.exit_code != '0'
        run: exit 1
